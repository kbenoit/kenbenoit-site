[build]
  command = "npm ci && hugo --gc --minify && npx pagefind --site public"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.160.1"
  NODE_VERSION = "22"
  GO_VERSION = "1.22.5"

[context.production.environment]
  HUGO_ENV = "production"

# Deploy previews also run the legacy URL check and the search/AI-visibility check; a failure fails the preview.
[context.deploy-preview]
  command = "npm ci && hugo --gc --minify && npx pagefind --site public && python3 _automation/check_legacy_urls.py --dir public && python3 _automation/check_ai_visibility.py --dir public"

[[headers]]
  for = "*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# BibTeX entries open as plain text in the browser.
[[headers]]
  for = "/bibtex/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
