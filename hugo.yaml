baseURL: "https://kenbenoit.net/"
title: "Kenneth Benoit"
languageCode: en-us
enableRobotsTXT: true

module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

outputs:
  home: [HTML, RSS]

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types

permalinks:
  publication: /publication/:contentbasename/
  projects: /projects/:contentbasename/

menu:
  main:
    - { name: Bio, url: /bio/, weight: 10 }
    - { name: Projects, url: /projects/, weight: 20 }
    - { name: Publications, url: /publication/, weight: 30 }
    - { name: Teaching, url: /teaching/, weight: 40 }
    - { name: People, url: /people/, weight: 50 }
    - { name: Blog, url: /posts/, weight: 60 }
    - { name: CV, url: /pdfs/KenBenoitCV.pdf, weight: 70 }

params:
  appearance:
    color: blue          # a Blox theme file must exist; custom.css overrides it
    mode: light
    font: native
    font_size: L
  header:
    navbar:
      enable: true
      show_search: true
      show_theme_chooser: false
      logo:
        text: "KENNETH BENOIT"
  footer:
    text: ""
  # Owner facts. Change the title here and only here (Lee Kong Chian title ends July 2027).
  owner:
    name: "Kenneth Benoit"
    title: "Dean, School of Social Sciences, and Lee Kong Chian Professor of Computational Social Science"
    institution: "Singapore Management University"
    institution_url: "https://socsc.smu.edu.sg"
    email: "kbenoit@smu.edu.sg"
    address: "School of Social Sciences, 10 Canning Rise, Singapore Management University, Singapore 179873"
    photo: "media/avatar.jpg"
    photo_alt: "Portrait of Kenneth Benoit, Singapore Management University"
    scholar: "https://scholar.google.com/citations?user=hp1p9TEAAAAJ"
    github: "https://github.com/kbenoit"
    cv: "/pdfs/KenBenoitCV.pdf"
    # Short orientation text for the home page; the full bio lives on /bio/.
    intro: >-
      His research uses large language models and machine learning to analyze
      political texts and social media, and his substantive work covers
      comparative party competition, the European Parliament, and electoral
      systems. His software includes the quanteda family of R packages for
      quantitative text analysis.
  features:
    search:
      provider: pagefind
  marketing:
    seo:
      description: "Kenneth Benoit, Dean of the School of Social Sciences and Lee Kong Chian Professor of Computational Social Science at Singapore Management University."

  # Opt-out switches for the mysite footer credit and invisible metadata.
  mysite:
    credit: true
    discovery: true

markup:
  goldmark:
    renderer:
      unsafe: true
