baseURL: "https://kenbenoit.net/"
title: "Kenneth Benoit"
languageCode: en-us
enableRobotsTXT: true

security:
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^npx$', '^tailwindcss$']

module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

outputs:
  home: [HTML, RSS, REDIRECTS, LLMS]

mediaTypes:
  text/netlify:
    delimiter: ""

outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  REDIRECTS:
    mediaType: text/netlify
    baseName: _redirects
    isPlainText: true
    notAlternative: true

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types

permalinks:
  page:
    publication: /publication/:contentbasename/
    projects: /projects/:contentbasename/
  term:
    tags: /tag/:slug/
    categories: /category/:slug/
  taxonomy:
    tags: /tags/
    categories: /categories/

menu:
  main:
    - { name: Bio, url: /bio/, weight: 10 }
    - { name: Projects, url: /projects/, weight: 20 }
    - { name: Publications, url: /publication/, weight: 30 }
    - { name: Teaching, url: /teaching/, weight: 40 }
    - { name: People, url: /people/, weight: 50 }
    - { name: CV, url: /pdfs/KenBenoitCV.pdf, weight: 60 }

params:
  appearance:
    color: blue          # a Blox theme file must exist; custom.css overrides it
    mode: light
    font: native
    font_size: L
  header:
    navbar:
      enable: true
      show_search: true
      show_theme_chooser: false
      logo:
        text: "KENNETH BENOIT"
  footer:
    text: ""
  # Owner facts. Change the title here and only here (Lee Kong Chian title ends July 2027).
  owner:
    name: "Kenneth Benoit"
    title: "Dean, School of Social Sciences, and Lee Kong Chian Professor of Computational Social Science"
    institution: "Singapore Management University"
    institution_url: "https://socsc.smu.edu.sg"
    email: "kbenoit@smu.edu.sg"
    address: "School of Social Sciences, 10 Canning Rise, Singapore Management University, Singapore 179873"
    photo: "media/avatar.jpg"
    photo_alt: "Portrait of Kenneth Benoit, Singapore Management University"
    scholar: "https://scholar.google.com/citations?user=hp1p9TEAAAAJ"
    github: "https://github.com/kbenoit"
    cv: "/pdfs/KenBenoitCV.pdf"
    # Icon row on the home page, in order. Icons live in assets/icons/<icon>.svg.
    social:
      - { label: "Email", icon: email, url: "mailto:kbenoit@smu.edu.sg" }
      - { label: "Google Scholar", icon: googlescholar, url: "https://scholar.google.com/citations?user=hp1p9TEAAAAJ" }
      - { label: "ORCID", icon: orcid, url: "https://orcid.org/0000-0002-0797-564X" }
      - { label: "X", icon: x, url: "https://x.com/kenbenoit" }
      - { label: "Bluesky", icon: bluesky, url: "https://bsky.app/profile/kenbenoit.bsky.social" }
      - { label: "LinkedIn", icon: linkedin, url: "https://www.linkedin.com/in/krbenoit/" }
      - { label: "GitHub", icon: github, url: "https://github.com/kbenoit" }
      - { label: "Stack Overflow", icon: stackoverflow, url: "https://stackoverflow.com/users/4158274/ken-benoit" }
    # Short orientation text for the home page; the full bio lives on /bio/.
    intro: >-
      My research uses large language models and machine learning to analyze
      political texts and social media, and my substantive work covers
      comparative party competition, the European Parliament, and electoral
      systems. My software includes the quanteda family of R packages for
      quantitative text analysis.
  features:
    search:
      provider: pagefind
  marketing:
    seo:
      description: "Kenneth Benoit, Dean of the School of Social Sciences and Lee Kong Chian Professor of Computational Social Science at Singapore Management University."

  # Opt-out switches for the mysite footer credit and invisible metadata.
  mysite:
    credit: true
    discovery: true

markup:
  goldmark:
    renderer:
      unsafe: true
