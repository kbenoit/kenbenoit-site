{{ define "main" }}
<main id="main" class="wrap page">
  <p class="crumbs"><a href="{{ site.Home.RelPermalink }}">Home</a></p>
  <h1>{{ .Title }}</h1>
  <ul class="coauthors">
    {{ range .Data.Terms.Alphabetical }}<li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> <span class="count">{{ .Count }}</span></li>{{ end }}
  </ul>
</main>
{{ end }}
