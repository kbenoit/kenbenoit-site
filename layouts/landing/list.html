{{ define "main" }}
{{- $o := site.Params.owner -}}
{{- $photo := resources.Get $o.photo -}}
<main id="main" class="wrap home" data-pagefind-body>
  <section class="hero" aria-labelledby="hero-name">
    {{ with $photo }}
      {{- $img := .Resize "300x300 jpg q85" -}}
      <img class="hero-photo" src="{{ $img.RelPermalink }}" width="150" height="150" alt="{{ $o.photo_alt }}" fetchpriority="high" decoding="async" />
    {{ end }}
    <div class="hero-text">
      <p class="eyebrow"><a href="{{ $o.institution_url }}">{{ $o.institution }}</a></p>
      <h1 id="hero-name">{{ $o.name }}</h1>
      <p class="hero-title">{{ $o.title }}</p>
      <p class="hero-intro">{{ $o.intro }}</p>
      <ul class="actions">
        <li><a class="btn" href="{{ $o.cv | relURL }}">Download CV</a></li>
        <li><a class="btn" href="mailto:{{ $o.email }}">Email</a></li>
        <li><a class="btn" href="{{ $o.scholar }}" rel="noopener">Google Scholar</a></li>
        <li><a class="btn" href="{{ $o.github }}" rel="noopener">GitHub</a></li>
      </ul>
    </div>
  </section>
</main>
{{ end }}
